name: CI

on:
  push:
    branches: [main, "roadmap/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine (lint and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the Dockerfile ships.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        run: pip install -r requirements.txt "pytest>=8.0" "pytest-asyncio>=0.23" "httpx>=0.27" "asgi-lifespan>=2.1" "ruff>=0.4"

      - name: Lint
        run: ruff check engine/ tests/ scripts/ alembic/ start.py

      - name: Tests
        run: pytest -q

  app:
    name: App (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Browser extension has the current design system
        working-directory: .
        run: |
          node plugins/browser-extension/scripts/sync-design.mjs
          git diff --exit-code -- plugins/browser-extension

  extensions:
    name: Extensions (VS Code installer, browser scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/vscode-extension/package-lock.json

      - name: VS Code extension compiles and packages
        working-directory: plugins/vscode-extension
        run: |
          npm ci --ignore-scripts
          npm run package

      - name: Browser extension and LMS connector scripts parse
        run: |
          for f in plugins/browser-extension/*.js plugins/browser-extension/popup/*.js \
                   plugins/browser-extension/scripts/*.mjs plugins/lms-connector/*.js; do
            node --check "$f"
          done

      - name: Manifests are valid JSON
        run: |
          for f in plugins/*/manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: clr-vscode
          path: plugins/vscode-extension/clr-vscode.vsix
          retention-days: 30
