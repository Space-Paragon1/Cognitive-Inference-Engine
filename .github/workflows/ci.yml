name: CI

on:
  push:
    branches: [main, "roadmap/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine (lint and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the Dockerfile ships.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        run: pip install -r requirements.txt "pytest>=8.0" "pytest-asyncio>=0.23" "httpx>=0.27" "asgi-lifespan>=2.1" "ruff>=0.4"

      - name: Lint
        run: ruff check engine/ tests/ scripts/ alembic/ start.py

      - name: Tests
        run: pytest -q

  app:
    name: App (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Browser extension has the current design system
        working-directory: .
        run: |
          node plugins/browser-extension/scripts/sync-design.mjs
          git diff --exit-code -- plugins/browser-extension

  web-image:
    name: Web app container (the image Railway runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t clr-web frontend

      - name: Run
        run: |
          docker run -d --name clr-web -p 8080:9000 -e PORT=9000 clr-web
          for i in $(seq 1 20); do curl -fs http://localhost:8080/health && break; sleep 1; done

      - name: Health check, page, manifest and service worker
        run: |
          set -e
          test "$(curl -fs http://localhost:8080/health)" = "ok"
          curl -fs http://localhost:8080/ | grep -q "<title>Cognitive Load Router</title>"
          curl -fs http://localhost:8080/some/deep/link | grep -q 'id="root"'
          curl -fs http://localhost:8080/manifest.webmanifest | grep -q '"short_name": "CLR"'
          curl -fs http://localhost:8080/sw.js | grep -q "const SHELL = \["
          curl -fs http://localhost:8080/icons/icon-512.png -o /dev/null

      - name: Caching and security headers
        run: |
          set -e
          headers() { curl -fsI "http://localhost:8080$1" | tr -d '\r'; }
          asset=$(curl -fs http://localhost:8080/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          headers "$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          headers /sw.js | grep -qi '^cache-control: no-cache'
          headers / | grep -qi '^cache-control: no-cache'
          headers / | grep -qi '^x-content-type-options: nosniff'
          headers / | grep -qi '^x-frame-options: DENY'
          headers / | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          ! headers / | grep -qi '^server:'
          curl -fs -H 'Accept-Encoding: gzip' -o /dev/null -w '%{size_download} bytes gzipped\n' "http://localhost:8080$asset"

      - name: Container logs
        if: always()
        run: docker logs clr-web

  extensions:
    name: Extensions (VS Code installer, browser scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/vscode-extension/package-lock.json

      - name: VS Code extension compiles and packages
        working-directory: plugins/vscode-extension
        run: |
          npm ci --ignore-scripts
          npm run package

      - name: Browser extension and LMS connector scripts parse
        run: |
          for f in plugins/browser-extension/*.js plugins/browser-extension/popup/*.js \
                   plugins/browser-extension/scripts/*.mjs plugins/lms-connector/*.js; do
            node --check "$f"
          done

      - name: Manifests are valid JSON
        run: |
          for f in plugins/*/manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: clr-vscode
          path: plugins/vscode-extension/clr-vscode.vsix
          retention-days: 30
