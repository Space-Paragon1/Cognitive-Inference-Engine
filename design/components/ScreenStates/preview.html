<!-- @dsCard group="Screens" page width=1520 height=2800 subtitle="Loading, reconnecting, offline, no data yet, low confidence, error" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenStates</title></head>
<body>
<div id="root"></div>
<script>
var C = window.CLR, root = document.getElementById('root'), I = C.icon, B = C.Button;
var S = C.Skel;
var nodata = '<div class="clr-grid" style="align-items:start"><div class="clr-span-8 clr-stack" style="gap:24px"><div class="clr-card" style="display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;padding:28px">' + C.LoadGauge({ load: 0, context: 'unknown', confidence: 0, size: 240, foot: false, empty: true }) +
  '<div class="clr-stack" style="gap:14px"><p class="clr-overline">No data yet</p><h2 class="clr-h1">Connect a source to see your load</h2><p class="clr-p clr-muted">CLR reads how you work, not what you work on. The browser extension takes about a minute to set up, and the dashboard comes alive as soon as it sends its first signal.</p><div class="clr-row">' + B({ label: 'Connect the browser extension', iconRight: 'arrow-right' }) + B({ label: 'See all sources', variant: 'ghost' }) + '</div></div></div>' +
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">' + C.SourceCard({ kind: 'browser', state: 'waiting', code: 'H2M-9PX' }) + C.SourceCard({ kind: 'vscode', state: 'idle' }) + '</div></div>' +
  '<div class="clr-span-4 clr-stack" style="gap:24px">' + C.DirectivesFeed({ items: [] }) + '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Up next</h3></div>' + C.TaskRow(Object.assign({ recommended: true, start: false }, C.sample.tasks[1])) + '<p class="clr-p clr-body-sm clr-subtle" style="margin-top:10px">Tasks still work without sources. They reorder once CLR can read your load.</p></div>' + QuickNo() + '</div></div>';
function QuickNo() { return C.QuickActions(); }
var loading = '<div class="clr-card" style="display:grid;justify-items:center;gap:16px;padding:24px 16px" aria-busy="true" aria-label="Loading"><div style="width:220px;height:220px;border-radius:50%;border:14px solid var(--skeleton)"></div>' + S(120, 28, 14) + S('80%', 14) + S('60%', 14) + '</div><div class="clr-card clr-stack" style="gap:14px">' + S(160, 18) + S('100%', 8, 4) + S('100%', 8, 4) + S('100%', 8, 4) + '</div><div class="clr-card clr-stack" style="gap:12px">' + S(140, 18) + '<div class="clr-row" style="flex-wrap:nowrap">' + S(40, 40, 12) + '<span class="clr-stack" style="gap:8px;flex:1">' + S('70%', 14) + S('90%', 12) + '</span></div></div>';
var stale = { load: .62, context: 'deep_focus', confidence: .8 };
var recon = C.Banner({ tone: 'caution', icon: 'refresh', title: 'Reconnecting…', body: 'Showing your last reading from 9:58 pm.' }) + '<div style="opacity:.55;filter:grayscale(.6)">' + C.HeroMobile(Object.assign({ status: 'reconnecting' }, stale)) + '</div>' + C.QuickActions({ grid: true });
var off = C.Banner({ neutral: true, icon: 'wifi-off', title: 'You are offline.', body: 'Timers and tasks still work. Live load is paused.', action: 'Retry' }) + '<div class="clr-card" style="display:grid;justify-items:center;gap:12px;text-align:center;padding:24px 16px"><div style="opacity:.5">' + C.LoadGauge({ load: .62, context: 'deep_focus', confidence: .8, size: 200 }) + '</div><p class="clr-p clr-muted clr-body-sm">Last reading 9:58 pm, 4 minutes ago</p>' + C.ConnectionStatus({ status: 'offline' }) + '</div>' + C.QuickActions({ grid: true });
var lowc = C.Banner({ context: 'unknown', icon: 'circle-dashed', title: 'Still learning how you work today.', body: 'Estimates firm up after about 2 minutes.' }) + C.HeroMobile({ load: .47, context: 'unknown', confidence: .32, breakdown: { intrinsic: .3, extraneous: .2, germane: .3 } }) + '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">What makes up your load</h3><span class="clr-badge" data-ctx="unknown">Rough</span></div><div style="opacity:.6">' + C.Breakdown({ intrinsic: .3, extraneous: .2, germane: .3, compact: true }) + '</div></div>';
var err = '<div class="clr-card" style="margin-top:8px">' + C.EmptyState({ icon: 'alert-circle', tone: 'critical', title: 'Something went wrong on our side', body: 'Your data is safe. We could not load your history just now. Error 503 · req 7f3a', actions: [B({ label: 'Try again', icon: 'refresh' }), B({ label: 'Report', variant: 'ghost' })] }) + '</div>' + C.Banner({ tone: 'critical', icon: 'alert-circle', title: 'Couldn’t save your task.', body: 'Check your connection.', action: 'Retry' });
var nod = '<div class="clr-card" style="display:grid;justify-items:center;gap:14px;text-align:center;padding:24px 16px">' + C.LoadGauge({ load: 0, context: 'unknown', confidence: 0, size: 180, foot: false, empty: true }) + '<h2 class="clr-h2">Connect a source to see your load</h2><p class="clr-p clr-muted clr-body-sm">CLR reads how you work, not what you work on.</p>' + B({ label: 'Connect a source', block: true, iconRight: 'arrow-right' }) + '</div>' + C.SourceCard({ kind: 'browser', state: 'idle', recommended: true }) + C.SourceCard({ kind: 'vscode', state: 'idle' });
root.innerHTML = C.Board({ sections: [
  { title: 'No data yet · desktop 1440', note: 'The most important empty state: no sources connected. The gauge shows an empty track with a dash, never 0%. Tasks and timers stay fully usable.', html: C.Desk({ active: 'now', title: 'Welcome, Sam', sub: 'Let’s get your first reading', status: 'nodata', content: nodata, actions: C.ConnectionStatus({ status: 'offline' }).replace('Offline', 'No sources') + B({ label: 'Start focus', icon: 'timer' }) }) },
  { title: 'Mobile 390 · row 1', note: 'Loading skeleton · Reconnecting (stale data dimmed, last reading time) · Offline', phones: [C.Phone({ tab: 'now', content: loading, state: false, right: S(72, 32, 16) }), C.Phone({ tab: 'now', content: recon }), C.Phone({ tab: 'now', content: off, state: false })] },
  { title: 'Mobile 390 · row 2', note: 'Low confidence (dotted arc, ≈ number, outlined pill) · Error (full and inline) · No data yet', phones: [C.Phone({ tab: 'now', content: lowc, state: { load: .47, context: 'unknown', confidence: .32 } }), C.Phone({ tab: 'insights', title: 'Insights', content: err }), C.Phone({ tab: 'now', content: nod, state: false })] }
] });
</script>
</body>
</html>
