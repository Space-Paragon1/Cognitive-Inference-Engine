<!-- @dsCard group="Screens" page width=1520 height=1900 subtitle="Weekly KPIs, daily focus, context mix, table, reflection and heatmap slots" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenInsights</title></head>
<body>
<div id="root"></div>
<script>
var C = window.CLR, root = document.getElementById('root'), I = C.icon, B = C.Button;
var W = C.sample.week;
var kpis = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">' + C.StatTile({ label: 'Total focus time', icon: 'timer', value: '12.3', unit: 'h', sub: '1.4 h more than last week', trend: 'up' }) + C.StatTile({ label: 'Best focus day', icon: 'calendar', value: 'Wed', sub: '3.4 h, mostly 9 – 11 am' }) + C.StatTile({ label: 'Average load', icon: 'gauge', value: '51', unit: '%', sub: 'Comfortably in range' }) + C.StatTile({ label: 'Focus efficiency', icon: 'target', value: '63', unit: '%', sub: 'Share of tracked time in deep focus' }) + '</div>';
var bars = '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Focus time per day</h3></div>' + C.BarChart({ w: 330, h: 220 }) + '</div>';
var stack = '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Context mix per day</h3></div>' + C.StackedBars({ w: 330, h: 190 }) + '<div class="clr-legend" style="gap:6px 12px">' + C.CTX_ORDER.slice(0, 5).map(function (k) { return '<span data-ctx="' + k + '">' + I(C.CTX[k].icon, 13) + C.CTX[k].label + '</span>'; }).join('') + '</div></div>';
var refl = '<div class="clr-card clr-stack" style="gap:12px;background:var(--accent-soft);border-color:transparent"><div class="clr-card__head" style="margin:0"><h3 class="clr-card__title">' + I('pen-line', 18, 'style="color:var(--accent)"') + 'Weekly reflection</h3>' + C.Badge('Preview', 'accent') + '</div>' +
  '<p class="clr-p clr-body-lg">You focus best between <b>9 and 11 am</b>. Wednesday was your strongest day, with 3.4 hours.</p><p class="clr-p clr-muted">Tuesdays you get stuck more often, mostly in CS 201 labs. Starting those after a short break could help.</p><p class="clr-p clr-body-sm clr-subtle">Written from your week’s data. Never shared.</p><div class="clr-row">' + B({ label: 'Plan next week', variant: 'secondary', size: 'sm' }) + B({ label: 'Not helpful', variant: 'ghost', size: 'sm' }) + '</div></div>';
var table = '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Day by day</h3>' + B({ label: 'Export CSV', icon: 'download', variant: 'ghost', size: 'sm' }) + '</div><table class="clr-table"><tr><th>Day</th><th class="num">Focus</th><th class="num">Sessions</th><th class="num">Avg load</th><th class="num">Peak</th><th>Mostly</th></tr>' +
  W.map(function (d) { return '<tr><td class="is-strong">' + d.d + (d.d === 'Wed' ? ' ' + C.Badge('Best', 'accent') : '') + '</td><td class="num">' + d.h + ' h</td><td class="num">' + d.sessions + '</td><td class="num">' + d.load + '%</td><td class="num">' + d.peak + '%</td><td>' + C.ContextPill({ context: d.top, size: 'sm' }) + '</td></tr>'; }).join('') + '</table></div>';
var heat = '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Your best hours</h3>' + C.Badge('Preview', 'accent') + '</div>' + C.Heatmap({ cell: 17 }) + '</div>';
var desk = '<div class="clr-stack" style="gap:24px">' + kpis + '<div class="clr-grid" style="align-items:start"><div class="clr-span-4">' + bars + '</div><div class="clr-span-4">' + stack + '</div><div class="clr-span-4">' + refl + '</div><div class="clr-span-7">' + table + '</div><div class="clr-span-5">' + heat + '</div></div></div>';
var seg = '<div style="display:flex">' + C.Segmented({ options: ['Week', 'History'], value: 'Week' }).replace('class="clr-seg"', 'class="clr-seg" style="display:flex;width:100%"').replace(/<button type="button"/g, '<button type="button" style="flex:1"') + '</div>';
var wk = '<div class="clr-row" style="justify-content:space-between">' + B({ label: 'Previous week', icon: 'chevron-left', variant: 'ghost', iconOnly: true }) + '<b>17 – 23 November</b>' + B({ label: 'Next week', icon: 'chevron-right', variant: 'ghost', iconOnly: true, disabled: true }) + '</div>';
var m1 = seg + wk + '<div class="clr-kv">' + C.StatTile({ label: 'Focus', value: '12.3', unit: 'h' }) + C.StatTile({ label: 'Best day', value: 'Wed' }) + C.StatTile({ label: 'Avg load', value: '51', unit: '%' }) + C.StatTile({ label: 'Efficiency', value: '63', unit: '%' }) + '</div><div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Focus time per day</h3></div>' + C.BarChart({ w: 322, h: 200 }) + '</div>';
var m2 = refl + '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Context mix per day</h3></div>' + C.StackedBars({ w: 322, h: 180 }) + '<div class="clr-legend" style="gap:6px 12px">' + C.CTX_ORDER.slice(0, 5).map(function (k) { return '<span data-ctx="' + k + '">' + I(C.CTX[k].icon, 13) + C.CTX[k].label + '</span>'; }).join('') + '</div></div>';
var m3 = '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Your best hours</h3>' + C.Badge('Preview', 'accent') + '</div>' + C.Heatmap({ cell: 14, from: 8, to: 23 }) + '</div><div class="clr-card" style="padding:4px 16px"><div class="clr-list">' + W.slice(0, 5).map(function (d) { return '<div class="clr-list__row">' + C.MiniGauge({ load: d.load / 100, context: d.top, size: 36 }) + '<span><b style="font-weight:600">' + d.d + (d.d === 'Wed' ? ' · best' : '') + '</b><small class="clr-num">' + d.h + ' h focus · ' + d.sessions + ' sessions · avg ' + d.load + '%</small></span></div>'; }).join('') + '</div></div>';
root.innerHTML = C.Board({ sections: [
  { title: 'Insights · desktop 1440', note: 'Week of 17 – 23 November. The reflection card and heatmap are future slots, designed now and marked Preview until they ship.', html: C.Desk({ active: 'insights', title: 'Insights', sub: '17 – 23 November', content: desk, actions: B({ label: 'Previous week', icon: 'chevron-left', variant: 'secondary', iconOnly: true }) + B({ label: 'Next week', icon: 'chevron-right', variant: 'secondary', iconOnly: true, disabled: true }) }) },
  { title: 'Mobile 390', note: 'KPIs and daily bars · reflection and context mix · best hours and the day list', phones: [C.Phone({ tab: 'insights', title: 'Insights', content: m1 }), C.Phone({ tab: 'insights', title: 'Insights', content: m2 }), C.Phone({ tab: 'insights', title: 'Insights', content: m3 })] }
] });
</script>
</body>
</html>
