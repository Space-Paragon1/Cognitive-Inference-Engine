<!-- @dsCard group="Screens" page width=1520 height=1900 subtitle="Pomodoro, thresholds, session gap, notifications, sources, account, privacy" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenSettings</title></head>
<body>
<div id="root"></div>
<script>
var C = window.CLR, root = document.getElementById('root'), I = C.icon, B = C.Button;
var nav = '<nav class="clr-subnav" aria-label="Settings sections">' + [['timer', 'Pomodoro', 1], ['gauge', 'Load thresholds'], ['history', 'Sessions'], ['bell', 'Notifications'], ['globe', 'Connected sources'], ['user', 'Account'], ['lock', 'Privacy']].map(function (x) { return '<a href="#" ' + (x[2] ? 'aria-current="true"' : '') + '>' + I(x[0], 18) + x[1] + '</a>'; }).join('') + '</nav>';
var sec = function (t, d, body) { return '<section class="clr-card clr-stack" style="gap:20px"><div><h2 class="clr-h3">' + t + '</h2>' + (d ? '<p class="clr-p clr-body-sm clr-muted" style="margin-top:2px">' + d + '</p>' : '') + '</div>' + body + '</section>'; };
var pomo = sec('Pomodoro', 'Focus length adapts to your load (10, 15, 25 or 35 min). Breaks are yours to set.', '<div style="display:grid;grid-template-columns:1fr 1fr;gap:32px">' + C.Slider({ label: 'Short break', value: 7, def: 5, min: 1, max: 15, unit: ' min' }) + C.Slider({ label: 'Long break', value: 15, def: 15, min: 5, max: 40, unit: ' min', help: 'After every 4 sessions.' }) + '</div>');
var thr = sec('Load thresholds', 'Where “high load” and “fatigue” begin for you. Fatigue always sits above high load.', '<div class="clr-zones clr-num" aria-hidden="true"><span style="flex:70;background:var(--surface-sunken);color:var(--ink-muted)">Normal · below 70%</span><span data-ctx="shallow_work" style="flex:15;background:var(--c-soft);color:var(--c)">High · 70%</span><span data-ctx="fatigue" style="flex:15;background:var(--c-soft);color:var(--c)">Fatigue · 85%</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:32px">' + C.Slider({ label: 'High load', value: 70, def: 70, min: 50, max: 95, unit: '%' }) + C.Slider({ label: 'Fatigue', value: 85, def: 85, min: 60, max: 99, unit: '%', blockBelow: 71, help: 'Can’t go below 71%.' }) + '</div>');
var gap = sec('Sessions', null, '<div style="max-width:420px">' + C.Slider({ label: 'Session gap', value: 10, def: 10, min: 2, max: 60, unit: ' min', help: 'Idle longer than this ends a session.' }) + '</div>');
var desk = '<div style="display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start"><div>' + nav + '</div><div class="clr-stack" style="gap:24px;max-width:860px">' + pomo + thr + gap + '</div></div>';
var more = '<div class="clr-card" style="padding:4px 16px"><div class="clr-list">' + [['history', 'History', 'Replay sessions, event log'], ['settings', 'Settings', 'Timers, thresholds, notifications'], ['globe', 'Connected sources', '2 of 4 connected'], ['help', 'Help and feedback', '']].map(function (x) { return '<a class="clr-list__row" href="#">' + I(x[0], 20) + '<span><b style="font-weight:500">' + x[1] + '</b>' + (x[2] ? '<small>' + x[2] + '</small>' : '') + '</span>' + I('chevron-right', 18, 'style="color:var(--ink-subtle)"') + '</a>'; }).join('') + '</div></div>' +
  '<div class="clr-card" style="padding:4px 16px">' + '<div class="clr-toggle-row"><div class="clr-toggle-row__text"><span class="clr-toggle-row__label">Theme</span></div>' + C.Segmented({ options: ['System', 'Dark', 'Light'], value: 'Dark', size: 'sm' }) + '</div></div>' +
  '<div class="clr-card" style="padding:4px 16px"><div class="clr-list"><div class="clr-list__row"><span class="clr-avatar">SR</span><span><b style="font-weight:500">sam@uni.edu</b><small>Signed in since 3 Nov</small></span></div><a class="clr-list__row" href="#">' + I('log-out', 20) + '<span>Sign out</span></a></div></div>';
var notif = '<p class="clr-overline">Notifications</p><div class="clr-card" style="padding:4px 16px">' + C.Toggle({ row: true, on: true, label: 'Break prompts', desc: 'When a Pomodoro ends.' }) + '<hr class="clr-divider" style="margin:0">' + C.Toggle({ row: true, on: true, label: 'Context changes', desc: 'Deep focus, stuck, recovering.' }) + '<hr class="clr-divider" style="margin:0">' + C.Toggle({ row: true, on: true, label: 'Overload warnings', desc: 'Load above 85% for 5 min.' }) + '<hr class="clr-divider" style="margin:0">' + C.Toggle({ row: true, on: false, label: 'Vibrate', desc: 'Haptics on timer buttons and alerts.' }) + '</div>' +
  '<p class="clr-overline">Connected sources</p>' + C.SourceCard({ kind: 'browser', state: 'connected', lastSeen: '4s' }) + C.SourceCard({ kind: 'vscode', state: 'connected', lastSeen: '12s' }) + C.SourceCard({ kind: 'lms', state: 'idle', optional: true });
var privacyBody = '<div class="clr-stack" style="gap:12px"><p class="clr-p clr-muted">This permanently removes your sessions, events, tasks and settings from CLR. Your account email goes too. This cannot be undone.</p>' + C.TextField({ label: 'Type DELETE to confirm', value: 'DELETE', valid: 'Confirmed.' }) + '</div>';
var priv = '<p class="clr-overline">Privacy</p><div class="clr-card clr-stack" style="gap:12px"><p class="clr-p clr-body-sm clr-muted">Download everything CLR has stored about you as JSON and CSV.</p>' + B({ label: 'Export my data', icon: 'download', variant: 'secondary', block: true }) + '</div><div class="clr-card clr-stack" style="gap:12px;background:var(--critical-soft);border-color:transparent"><p class="clr-p clr-body-sm" style="color:var(--ink)"><b>Delete my data</b><br><span class="clr-muted">Removes everything, including your account.</span></p>' + B({ label: 'Delete my data', icon: 'trash', variant: 'danger-ghost', block: true }) + '</div>';
var overlay = '<div class="clr-scrim"></div>' + C.BottomSheet({ title: 'Delete everything?', body: privacyBody, actions: B({ label: 'Keep my data', variant: 'secondary' }) + B({ label: 'Delete forever', variant: 'danger' }), style: 'padding-bottom:36px' });
root.innerHTML = C.Board({ sections: [
  { title: 'Settings · desktop 1440', note: 'Section nav on the left, one card per group. Short break changed from its default, so “Reset to default” shows. The fatigue slider hatches the range it cannot enter.', html: C.Desk({ active: 'settings', title: 'Settings', sub: 'Changes save as you go', content: desk, actions: C.Badge('Saved', 'positive', 'check') }) },
  { title: 'Mobile 390', note: 'More tab · Notifications and connected sources · Privacy with the delete confirmation sheet', phones: [C.Phone({ tab: 'more', title: 'More', content: more }), C.Phone({ tab: 'more', title: 'Settings', back: true, state: false, right: '', content: notif }), C.Phone({ tab: 'more', title: 'Privacy', back: true, state: false, right: '', content: priv, overlay: overlay })] }
] });
</script>
</body>
</html>
