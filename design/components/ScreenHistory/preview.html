<!-- @dsCard group="Screens" page width=1520 height=1900 subtitle="Live chart, timeline replay, session stats, event log" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ScreenHistory</title></head>
<body>
<div id="root"></div>
<script>
var C = window.CLR, root = document.getElementById('root'), I = C.icon, B = C.Button;
var pts = C.series(160, 23);
var picker = '<div class="clr-input-wrap" style="width:340px">' + I('calendar', 18) + '<select class="clr-input clr-input--lead clr-select" aria-label="Session"><option>Tue 25 Nov · 8:12 – 9:00 pm · 48 min</option></select><span style="position:absolute;right:14px;pointer-events:none;color:var(--ink-subtle)">' + I('chevron-down', 18) + '</span></div>';
var replay = '<div class="clr-card clr-stack" style="gap:16px"><div class="clr-card__head" style="margin:0"><h3 class="clr-card__title">Timeline replay</h3>' + picker + '</div>' +
  C.LoadChart({ w: 660, h: 230, points: pts, playhead: 62, xLabels: ['8:12', '8:24', '8:36', '8:48', '9:00'], tooltip: C.Tooltip({ x: 300, y: 18, time: '8:30:41 pm', load: 71, context: 'stuck' }) }) +
  '<div class="clr-legend" style="margin-top:0">' + ['unknown', 'shallow_work', 'deep_focus', 'stuck', 'recovering'].map(function (k) { return '<span data-ctx="' + k + '">' + I(C.CTX[k].icon, 14) + C.CTX[k].label + '</span>'; }).join('') + '</div>' +
  C.PlaybackControls({ playing: true, pos: 1102, dur: 2880 }) + '</div>';
var stats = '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">This session</h3>' + C.ContextPill({ context: 'deep_focus', size: 'sm', label: 'Mostly deep focus' }) + '</div><div class="clr-kv">' +
  C.StatTile({ plain: true, label: 'Duration', icon: 'clock', value: '48', unit: 'min' }) + C.StatTile({ plain: true, label: 'Events', icon: 'list-checks', value: '412' }) + C.StatTile({ plain: true, label: 'Average load', icon: 'gauge', value: '58', unit: '%' }) + C.StatTile({ plain: true, label: 'Peak load', icon: 'trending-up', value: '88', unit: '%', sub: 'at 8:31 pm, while stuck' }) + '</div></div>';
var live = '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Live · last 5 min</h3>' + C.ConnectionStatus({ status: 'live' }) + '</div>' + C.LoadChart({ w: 316, h: 150, points: C.series(90, 4, [['shallow_work', .3, .5], ['deep_focus', .7, .62]]), xLabels: ['−5 min', 'now'], thresholds: [[.7, 'High'], [.85, 'Fatigue']] }) + '</div>';
var rows = [['8:30:41 pm', 'VS Code', 'Compile error (×3 in 40 s)', 71, 'stuck'], ['8:29:58 pm', 'Browser', 'Switched tab: stackoverflow.com', 66, 'stuck'], ['8:27:12 pm', 'VS Code', 'Typing burst, 94 keys/min', 58, 'deep_focus'], ['8:24:03 pm', 'Engine', 'Context → Deep focus', 55, 'deep_focus'], ['8:21:40 pm', 'Browser', '4 tab switches in 60 s', 63, 'shallow_work']];
var log = '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Event log</h3><span class="clr-row">' + C.FilterChip({ label: 'All', selected: true }) + C.FilterChip({ context: 'deep_focus' }) + C.FilterChip({ context: 'shallow_work' }) + C.FilterChip({ context: 'stuck', selected: false }) + C.FilterChip({ context: 'recovering' }) + B({ label: 'Export CSV', icon: 'download', variant: 'secondary', size: 'sm' }) + '</span></div>' +
  '<table class="clr-table"><tr><th>Time</th><th>Source</th><th>Event</th><th class="num">Load</th><th>Context</th></tr>' + rows.map(function (r) { return '<tr><td class="clr-num is-strong">' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td class="num">' + r[3] + '%</td><td>' + C.ContextPill({ context: r[4], size: 'sm' }) + '</td></tr>'; }).join('') + '</table></div>';
var desk = '<div class="clr-grid" style="align-items:start"><div class="clr-span-8">' + replay + '</div><div class="clr-span-4 clr-stack" style="gap:24px">' + stats + live + '</div><div class="clr-span-12">' + log + '</div></div>';
var seg = '<div style="display:flex">' + C.Segmented({ options: ['Week', 'History'], value: 'History' }).replace('class="clr-seg"', 'class="clr-seg" style="display:flex;width:100%"').replace(/<button type="button"/g, '<button type="button" style="flex:1"') + '</div>';
var sess = [['Today', '9:42 pm', '28 min', 61, 'deep_focus', 'running'], ['Today', '8:12 pm', '48 min', 58, 'deep_focus'], ['Today', '6:10 pm', '52 min', 49, 'deep_focus'], ['Mon 24', '7:05 pm', '41 min', 55, 'shallow_work'], ['Mon 24', '2:30 pm', '36 min', 63, 'stuck']];
var m1 = seg + '<div class="clr-card"><div class="clr-card__head"><h3 class="clr-card__title">Live · last 5 min</h3>' + C.ConnectionStatus({ status: 'live' }) + '</div>' + C.LoadChart({ w: 322, h: 150, points: C.series(90, 4, [['shallow_work', .3, .5], ['deep_focus', .7, .62]]), xLabels: ['−5 min', 'now'], thresholds: [[.7, 'High'], [.85, 'Fatigue']] }) + '</div>' +
  '<div class="clr-card" style="padding:4px 16px"><div class="clr-list">' + sess.map(function (s) { return '<a class="clr-list__row" href="#">' + C.MiniGauge({ load: s[3] / 100, context: s[4], size: 36 }) + '<span><b class="clr-num" style="font-weight:600">' + s[0] + ' · ' + s[1] + '</b><small class="clr-num">' + s[2] + ' · avg ' + s[3] + '%' + (s[5] ? ' · running' : '') + '</small></span>' + I('chevron-right', 18, 'style="color:var(--ink-subtle)"') + '</a>'; }).join('') + '</div></div>';
var m2 = '<div class="clr-card clr-stack" style="gap:14px;padding:16px"><span class="clr-caption">Tue 25 Nov · 8:12 – 9:00 pm</span>' + C.LoadChart({ w: 322, h: 180, points: pts, playhead: 62, xLabels: ['8:12', '8:36', '9:00'] }) + C.PlaybackControls({ playing: false, pos: 1102, dur: 2880 }).replace('class="clr-playback__row"', 'class="clr-playback__row" style="justify-content:center"') + '</div>' +
  '<div class="clr-card"><div class="clr-kv">' + C.StatTile({ plain: true, label: 'Duration', value: '48', unit: 'min' }) + C.StatTile({ plain: true, label: 'Events', value: '412' }) + C.StatTile({ plain: true, label: 'Avg load', value: '58', unit: '%' }) + C.StatTile({ plain: true, label: 'Peak', value: '88', unit: '%' }) + '</div></div>';
var m3 = '<div style="display:flex;gap:8px;overflow:hidden;margin:0 -16px;padding:0 16px">' + C.FilterChip({ label: 'All', selected: true }) + C.FilterChip({ context: 'deep_focus' }) + C.FilterChip({ context: 'shallow_work' }) + C.FilterChip({ context: 'stuck' }) + '</div>' +
  '<div class="clr-card" style="padding:4px 16px"><div class="clr-list">' + rows.map(function (r) { return '<div class="clr-list__row" style="align-items:flex-start;padding:12px 0"><span><small class="clr-num">' + r[0] + ' · ' + r[1] + '</small><b style="font-weight:500;font-size:14px;line-height:20px;margin:2px 0 6px">' + r[2] + '</b><span class="clr-row" style="gap:8px">' + C.ContextPill({ context: r[4], size: 'sm' }) + '<small class="clr-num">Load ' + r[3] + '%</small></span></span></div>'; }).join('') + '</div></div>' + B({ label: 'Export CSV', icon: 'download', variant: 'secondary', block: true });
root.innerHTML = C.Board({ sections: [
  { title: 'History · desktop 1440', note: 'Replay paused mid-session on a “stuck” stretch. The chart is coloured by context; the playhead runs left to right; unplayed data is dashed.', html: C.Desk({ active: 'history', title: 'History', sub: 'Replay a session, or scan the event log', content: desk, actions: C.ConnectionStatus({ status: 'live' }) }) },
  { title: 'Mobile 390', note: 'History lives inside Insights (Week | History) · Session replay · Event log with filter chips', phones: [C.Phone({ tab: 'insights', title: 'Insights', content: m1 }), C.Phone({ tab: 'insights', title: 'Session', back: true, right: B({ label: 'Export', icon: 'download', variant: 'ghost', iconOnly: true }), content: m2 }), C.Phone({ tab: 'insights', title: 'Event log', back: true, content: m3 })] }
] });
</script>
</body>
</html>
