[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-load-router"
version = "0.1.0"
description = "Local-first cognitive load routing engine for student productivity"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alex Chidera Umeasalugo" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "email-validator>=2.1.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    # Pinned to the minor version the bundled model (data/load_estimator.joblib)
    # was trained with. Retrain with scripts/train_estimator.py when bumping.
    "scikit-learn>=1.9,<1.10",
    "joblib>=1.3",
    "psutil>=5.9.0",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=21.3.0",
    "sqlalchemy>=2.1",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Windows-only extras for the desktop agent (not needed on the server)
desktop = ["pygetwindow>=0.0.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.4",
]

[project.scripts]
clr-engine = "engine.main:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
