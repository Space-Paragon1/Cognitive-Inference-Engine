/* Cognitive Load Router — generated from tokens.json */
:root, [data-theme="dark"] {
  --bg: #0c0e1a; /* Page background behind everything: app shell, sidebar gutter, blocked-tab overlay. */
  --surface: #141729; /* Cards, sidebar, tab bar and top bars. The default ground for text. */
  --surface-raised: #1b1f35; /* Toasts, menus, bottom sheets, popovers and the mini-player: anything floating above a card. Pair with a shadow token. */
  --surface-sunken: #090b14; /* Gauge and progress tracks, segmented-control wells, code and pairing-code boxes. Never put body text on it at less than 13px. */
  --surface-hover: #20243c; /* Hover and pressed fill for rows, ghost buttons and nav items. */
  --line: #252a42; /* Hairline dividers and card borders (1px). Decorative only: never the only edge of a control. */
  --line-strong: #646b8e; /* Control borders that must be seen: inputs, unchecked checkboxes, toggle tracks when off, secondary buttons in light mode. At least 3:1 on bg and surface in both themes. */
  --ink: #eef0f8; /* Primary text and icons on bg, surface and surface-raised. */
  --ink-muted: #a6acc6; /* Secondary text: explanations, reasons on directive cards, helper text. On bg, surface and surface-raised. */
  --ink-subtle: #8c93b0; /* Tertiary text: timestamps, axis ticks, captions, inactive tab labels. Still 4.5:1 on bg, surface, surface-raised and surface-sunken. */
  --ink-inverse: #171a2b; /* Text on surface-inverse (chart tooltips, the VS Code hover). */
  --surface-inverse: #eef0f8; /* Chart tooltips only. A small, high-contrast flag that floats over data. */
  --accent: #8f90ff; /* Brand periwinkle. Primary buttons, active nav, links, the selected task outline, focus-mode progress. As text on bg, surface and accent-soft. */
  --accent-hover: #a6a7ff; /* Hover and pressed fill for primary buttons. */
  --accent-soft: #23264a; /* Tinted ground behind accent icons and text: active nav item, directive icon tiles, the recommended task row. */

  --ctx-shallow-work-soft: #2d2609; /* Shallow work tinted ground: pill background, toast icon disc, filter chip when selected. */

  --ctx-stuck-soft: #3a1e0e; /* Stuck tinted ground: pill background, toast icon disc, filter chip when selected. */

  --rest-surface-raised: #142735; /* Cards and the breathing disc on a break screen. */
  --rest-line: #1e3545; /* Hairlines and the timer track on a break screen. */
  --rest-ink: #e6f2f8; /* Primary text on rest-surface and rest-surface-raised. */
  --rest-ink-muted: #9fbccb; /* Secondary text on rest-surface. */
  --rest-accent: #7cc7ee; /* Break timer arc, break buttons and icons on rest-surface. Text-safe there. */

  --chart-threshold: #646b8e; /* Dashed reference lines for the high-load and fatigue thresholds, and the gauge threshold ticks. */

  --heat-2: #4d4f94; /* Heatmap: some focus (10 to 25 min). */

  --heat-4: #a2a8fc; /* Heatmap: your best hours (45 min or more). */
  --skeleton: #1c2036; /* Skeleton block fill while data loads. */
  --skeleton-shine: #262b46; /* The moving highlight on a skeleton (static when reduced motion is on). */

/* ---------- Fonts (copied in by scripts/sync-design.mjs) ---------- */
@font-face { font-family: "Geist"; font-weight: 400; font-style: normal; font-display: block; src: url("../fonts/geist-400.woff2") format("woff2"); }
@font-face { font-family: "Geist"; font-weight: 500; font-style: normal; font-display: block; src: url("../fonts/geist-500.woff2") format("woff2"); }

/* ---------- Context and tone mapping ---------- */
:root, [data-ctx="unknown"] { --c: var(--ctx-unknown); --c-soft: var(--ctx-unknown-soft); }
[data-ctx="deep_focus"] { --c: var(--ctx-deep-focus); --c-soft: var(--ctx-deep-focus-soft); }
[data-ctx="shallow_work"] { --c: var(--ctx-shallow-work); --c-soft: var(--ctx-shallow-work-soft); }
[data-ctx="stuck"] { --c: var(--ctx-stuck); --c-soft: var(--ctx-stuck-soft); }
[data-ctx="fatigue"] { --c: var(--ctx-fatigue); --c-soft: var(--ctx-fatigue-soft); }
[data-ctx="recovering"] { --c: var(--ctx-recovering); --c-soft: var(--ctx-recovering-soft); }
[data-tone="accent"] { --c: var(--accent); --c-soft: var(--accent-soft); }
[data-tone="positive"] { --c: var(--positive); --c-soft: var(--positive-soft); }
[data-tone="caution"] { --c: var(--caution); --c-soft: var(--caution-soft); }
[data-tone="critical"] { --c: var(--critical); --c-soft: var(--critical-soft); }
[data-tone="neutral"] { --c: var(--ink-muted); --c-soft: var(--surface-sunken); }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  width: 360px; height: 520px; overflow: hidden;
  font-family: var(--font-sans); font-size: 15px; line-height: 22px;
  background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h2, p { margin: 0; }
:where(button, a, input, [tabindex]):focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
:where(button, a, input, [tabindex]):focus:not(:focus-visible) { outline: none; }
[hidden], #focusError:empty { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Frame ---------- */
.popup { height: 100%; display: flex; flex-direction: column; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line); }
.brand { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; line-height: 20px; font-weight: 600; }
.logo .links { fill: none; stroke: var(--accent); stroke-opacity: .55; stroke-width: 3.5; stroke-linecap: round; }
.logo .nodes { fill: var(--accent); }
.content { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px; display: grid; gap: 16px; align-content: start; }
.content.tight { gap: 12px; padding: 14px 16px; }
.content.center { align-content: center; justify-items: center; text-align: center; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 53px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12px; line-height: 16px; color: var(--ink-subtle); font-variant-numeric: tabular-nums; }

/* ---------- Type ---------- */
.h3 { font-size: 16px; line-height: 24px; font-weight: 600; }
.sm { font-size: 13px; line-height: 20px; }
.muted { color: var(--ink-muted); }
.caption { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-subtle); }
.tnum { font-variant-numeric: tabular-nums; }
.strong { color: var(--ink); font-weight: 600; }
.stack { display: grid; gap: 12px; width: 100%; }

/* ---------- Button (Button) ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 18px; border-radius: var(--radius-md); border: 1px solid transparent;
  font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; text-decoration: none;
  transition: background-color var(--dur-fast) var(--ease-standard), border-color var(--dur-fast), color var(--dur-fast), transform var(--dur-instant);
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.secondary { background: var(--surface-raised); color: var(--ink); border-color: var(--line-strong); }
